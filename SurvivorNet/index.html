<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurvivorNet | When the world goes offline</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body class="apocalyptic-theme">
    <!-- Screen 1: Splash Screen -->
    <section id="splash-screen" class="screen active">
        <div class="vignette"></div>
        <div class="content">
            <h1 class="glitch" data-text="SurvivorNet">SurvivorNet</h1>
            <p class="tagline">"When the world goes offline, survival shouldn’t."</p>
            <button id="start-btn" class="btn-primary">START</button>
        </div>
    </section>

    <!-- Screen 2: Survivor Setup -->
    <section id="setup-screen" class="screen">
        <div class="content">
            <h2>SURVIVOR SETUP</h2>
            <div class="input-group">
                <label for="survivor-name">SURVIVOR NAME</label>
                <input type="text" id="survivor-name" placeholder="Enter Name...">
            </div>
            <div class="input-group">
                <label>STATUS SELECTION</label>
                <div class="status-options">
                    <button class="status-btn" data-status="Safe">Safe</button>
                    <button class="status-btn" data-status="Need Supplies">Need Supplies</button>
                    <button class="status-btn" data-status="Injured">Injured</button>
                    <button class="status-btn" data-status="Need Rescue">Need Rescue</button>
                </div>
            </div>
            <button id="setup-next-btn" class="btn-primary">CONTINUE</button>
        </div>
    </section>

    <!-- Screen 3: Map Download -->
    <section id="download-screen" class="screen">
        <div class="content">
            <h2>SELECT REGION</h2>
            <div class="map-selector-mock">
                <div class="region-info">
                    <span>Region: Sector 7G</span>
                    <span>Size: 142 MB</span>
                </div>
                <div class="progress-bar-container">
                    <div id="download-progress" class="progress-bar"></div>
                </div>
            </div>
            <button id="download-btn" class="btn-primary">DOWNLOAD OFFLINE MAP</button>
        </div>
    </section>

    <!-- Screen 4: Main Dashboard -->
    <section id="dashboard-screen" class="screen">
        <div id="map"></div>
        
        <!-- Map UI Overlays -->
        <div class="top-bar">
            <div class="user-status-badge">
                <span id="display-name">Alex</span> | <span id="display-status">Safe</span>
            </div>
            <div id="ai-alert-banner" class="hidden">
                <span id="ai-alert-text"></span>
            </div>
        </div>

        <div class="side-controls">
            <button id="add-resource-btn" title="Add Resource" class="icon-btn">✚</button>
            <button id="network-btn" title="Survivor Network" class="icon-btn">📟</button>
            <button id="danger-btn" title="Danger Zone" class="icon-btn">⚠</button>
            <button id="scan-intel-btn" class="btn-accent">SCAN INTEL</button>
        </div>

        <button id="sos-btn" class="sos-btn">SOS ALERT</button>

        <!-- AI Inference Modal -->
        <div id="ai-modal" class="modal hidden">
            <div class="modal-content">
                <div id="ai-messages"></div>
                <pre id="ascii-hourglass"></pre>
            </div>
        </div>

        <!-- Resource Selection Modal -->
        <div id="resource-modal" class="modal hidden">
            <div class="modal-content">
                <h3>SELECT RESOURCE TYPE</h3>
                <div class="resource-grid">
                    <button class="res-type-btn" data-type="Hospital">🏥 Hospital</button>
                    <button class="res-type-btn" data-type="Supermarket">🛒 Food</button>
                    <button class="res-type-btn" data-type="Electronics">🔋 Power</button>
                    <button class="res-type-btn" data-type="Water">💧 Water</button>
                    <button class="res-type-btn" data-type="Shelter">⛺ Shelter</button>
                    <button class="res-type-btn" data-type="Fuel">⛽ Fuel</button>
                </div>
                <button id="close-resource-btn" class="btn-secondary">CANCEL</button>
            </div>
        </div>
    </section>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="network.js"></script>
    <script src="ai_engine.js"></script>
    <script src="map.js"></script>
    <script src="app.js"></script>
</body>
</html>
